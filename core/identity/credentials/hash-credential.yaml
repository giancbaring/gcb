kind: function
id: hash-credential
version: 1.0.0
domain: identity
module: credentials
api: credential-management

description: >
  Transform a Credential into a Secret suitable for storage. The
  transformation is a one-way function selected by the caller-supplied
  hasher. This is the counterpart to compare-secret: where comparison
  verifies, hashing produces. The output is a Secret carrying the
  algorithm identifier and the hashed bytes.

interface:
  inputs:
    - { name: credential, type: Credential, required: true }
    - { name: hasher,     type: Hasher,     required: true }
  outputs:
    - type: "Result<Secret, AuthFailure>"

depends_on:
  primitives:
    - result
    - credential
    - secret
    - auth-failure

invariants:
  - The returned Secret's storage form is produced by the hasher.
  - The credential never appears in the returned value or error.
  - Never throws. Hasher failure is returned as Err INTERNAL.
  - The function does not read a salt or any implicit randomness. That
    is the hasher's responsibility.

threats:
  - id: T1
    name: Reversible storage
    mitigation: >
      The hasher is expected to be one-way. The primitive does not
      enforce this, but the Secret storage form carries an algorithm
      identifier, so a reversible algorithm is discoverable.
  - id: T2
    name: Credential leakage via error
    mitigation: >
      Errors never include the credential. The hasher receives the raw
      string and returns a storage record; the credential is not echoed.
  - id: T3
    name: Hasher failure swallowing
    mitigation: >
      A throwing hasher returns Err INTERNAL. A silent success is not
      possible.
  - id: T4
    name: Weak algorithm introduced silently
    mitigation: >
      The algorithm identifier travels with the Secret. The comparison
      step may refuse unknown or deprecated algorithms. Weakness is
      visible, not hidden.

bindings:
  gms-governance:
    hasher: "argon2id with memory 19456, iterations 2, parallelism 1"

tests:
  - given: "a credential and a working hasher"
    expect: "Ok carrying a Secret produced by the hasher"
  - given: "the returned Secret"
    expect: "its algorithm matches the hasher's declared algorithm"
  - given: "a hasher that throws"
    expect: "Err INTERNAL; the throw does not escape"
  - given: "any result"
    expect: "the credential does not appear in the output"
