kind: function
id: compare-secret
version: 1.0.0
domain: identity
module: authentication/verification
api: identity-authentication

description: >
  Compare a Credential against a Secret in constant time. Returns a
  boolean-shaped Result. This is the atomic verification step — it says
  nothing about subjects, sessions, or authority. It only answers
  whether the presented proof matches the stored proof.

interface:
  inputs:
    - { name: presented, type: Credential, required: true }
    - { name: stored, type: Secret, required: true }
    - { name: comparator, type: "Comparator", required: true }
  outputs:
    - type: "Result<boolean, AuthFailure>"

depends_on:
  primitives:
    - result
    - credential
    - secret
    - auth-failure

invariants:
  - Comparison is constant-time with respect to the stored secret's length.
  - The function never returns the raw credential or the raw secret.
  - On any internal fault, the result is Err INTERNAL — never a thrown error.
  - A false result is Err MISMATCH, not Ok(false). Failure is a value.

threats:
  - id: T1
    name: Timing oracle
    mitigation: >
      The comparator MUST be constant-time. This function does not
      implement the comparator itself — the binding does — but it
      forbids early-exit comparisons by requiring the comparator to
      accept whole strings.
  - id: T2
    name: Credential leakage via error
    mitigation: >
      Errors never include the credential or the secret. The comparator
      receives both, and its return is a bare boolean.
  - id: T3
    name: Algorithm confusion
    mitigation: >
      The Secret carries its own algorithm identifier. The comparator
      receives both the credential and the secret's storage record. It
      is the comparator's responsibility to dispatch on the algorithm.

bindings:
  gms-governance:
    comparator: "constant-time hash-compare using node:crypto.timingSafeEqual"

tests:
  - given: "a comparator that returns true"
    expect: "Ok(true)"
  - given: "a comparator that returns false"
    expect: "Err MISMATCH"
  - given: "a comparator that throws"
    expect: "Err INTERNAL; the throw does not escape"
  - given: "any result"
    expect: "neither the credential nor the secret appears in the output"
