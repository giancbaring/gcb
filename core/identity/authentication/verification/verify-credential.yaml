kind: function
id: verify-credential
version: 1.0.0
domain: identity
module: authentication/verification
api: identity-authentication

description: >
  Prove that a Credential matches the Secret stored for an Identifier.
  Composes resolution and comparison into a single verification step.
  Returns the resolved Subject on success. Does not issue an Assertion,
  a Session, or a Principal — those are separate concerns.

interface:
  inputs:
    - { name: identifier,   type: Identifier,           required: true }
    - { name: credential,   type: Credential,           required: true }
    - { name: context,      type: VerificationContext,  required: true }
    - { name: comparator,   type: Comparator,           required: true }
  outputs:
    - type: "Result<Subject, AuthFailure>"

depends_on:
  primitives:
    - result
    - identifier
    - credential
    - secret
    - subject
    - auth-failure
  functions:
    - compare-secret

invariants:
  - Never throws. All failures are returned as Err.
  - On success, the returned Subject's identifier equals the input identifier.
  - The precise failure code is preserved — collapsing is a presentation concern.
  - The credential is never included in any returned value or error.

threats:
  - id: T1
    name: Resolver leakage of internal errors
    mitigation: >
      A throwing resolver is caught and mapped to INTERNAL. No raw error
      text escapes.
  - id: T2
    name: Identifier substitution
    mitigation: >
      The subject returned by the resolver is asserted to match the input
      identifier. A mismatch is INTERNAL, not a success.
  - id: T3
    name: Credential appearing in error output
    mitigation: >
      Verification never echoes the credential. The returned Result
      carries only the Subject or an AuthFailure code.

bindings:
  gms-governance:
    context: "resolves identifier -> { subject, secret } from users table"
    comparator: "constant-time hash-compare"

tests:
  - given: "a valid identifier, matching credential, and working resolver"
    expect: "Ok carrying the resolved Subject"
  - given: "an unknown identifier"
    expect: "Err UNKNOWN_SUBJECT"
  - given: "a valid identifier but non-matching credential"
    expect: "Err MISMATCH"
  - given: "a resolver that throws"
    expect: "Err INTERNAL; the throw does not escape"
  - given: "a resolver that returns a mismatched subject"
    expect: "Err INTERNAL"
  - given: "a failing result"
    expect: "the credential is not present in the returned error"
