kind: function
id: session-to-storage
version: 1.0.0
domain: identity
module: session/persistence
api: session-management

description: >
  Flatten a Session into a serializable record suitable for a storage
  layer. The output is plain data — strings, numbers, and a nested
  principal object — with no branded types, no frozen collections, and
  nothing that a database driver would need to understand. The result
  is guaranteed round-trippable: reading it back through
  session-from-storage reconstructs an equivalent Session.

interface:
  inputs:
    - { name: session, type: Session, required: true }
  outputs:
    - type: SessionStorageRecord

depends_on:
  primitives:
    - session
    - principal
    - timestamp
    - identifier

invariants:
  - The output carries every field of the input Session, unchanged.
  - The output is frozen. A caller cannot mutate it before persistence.
  - The output contains no methods, no symbols, and no branded types.
  - The output is JSON-serializable without loss.
  - Round-trip through session-from-storage reconstructs an equivalent Session.
  - The function never throws.

threats:
  - id: T1
    name: Authority flattening
    mitigation: >
      The principal's authority is a read-only facade over a Set. It is
      flattened into a plain string array for storage. The array is
      frozen so a caller cannot widen it after the call.
  - id: T2
    name: Branded types leaking to the driver
    mitigation: >
      The output casts branded values to their underlying primitives.
      A database driver receiving an Identifier sees a string.
  - id: T3
    name: Silent mutation of the input
    mitigation: >
      The function reads from the input and produces a new object. It
      does not mutate the input session.
  - id: T4
    name: Schema drift between storage layers
    mitigation: >
      The output type is declared explicitly. A storage adapter that
      expects a different shape fails at compile time.

bindings:
  gms-governance:
    destination: "sessions table"

tests:
  - given: "a well-formed session"
    expect: "a record with the same id, createdAt, expiresAt, and state"
  - given: "the returned record"
    expect: "its principal carries the same subject, sessionId, authority, and issuedAt"
  - given: "the returned record"
    expect: "it is frozen; the authority array is frozen"
  - given: "a session reconstructed from the record"
    expect: "it is equivalent to the original session"
  - given: "the input session"
    expect: "it is unchanged"
  - given: "the returned record"
    expect: "it survives JSON.parse(JSON.stringify(record)) without loss"
