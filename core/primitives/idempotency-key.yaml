kind: primitive
id: idempotency-key
version: 1.0.0
domain: foundation

description: >
  An opaque token identifying a logical request, so that the same
  request retried produces the same result without re-executing side
  effects. Distinct from Identifier: an Identifier names a subject
  permanently; an IdempotencyKey names one logical operation and is
  consumed by the first successful execution.

shape:
  type: branded-string
  brand: IdempotencyKey
  underlying: string
  properties:
    - name: value
      type: string
      description: The opaque token, chosen by the caller.
    - name: scope
      type: string
      description: The operation namespace the key applies to.

invariants:
  - A key is unique within its scope. Reuse within a scope means retry.
  - A key is not reused across scopes. Two operations with the same
    token but different scopes are distinct requests.
  - A key carries no embedded meaning. Components do not parse it.
  - The key is caller-supplied, not generated by the library.
  - An empty or absent key is invalid. There is no default key.

threats:
  - id: T1
    name: Key collision across operations
    mitigation: >
      Scope is a required field. Two operations with the same token but
      different scopes do not collide.
  - id: T2
    name: Library-generated keys
    mitigation: >
      The primitive requires the caller to supply the key. The library
      never invents one. This forces the caller to think about retry
      semantics at the call site.
  - id: T3
    name: Structural leakage
    mitigation: >
      No component may derive meaning from the key's contents. The key
      is treated as an opaque token, same as Identifier.
  - id: T4
    name: Long-lived keys
    mitigation: >
      The primitive does not enforce a lifetime. Retention policy is
      the storage layer's concern. Keys that live forever exhaust
      storage; a binding must set a TTL.

bindings:
  gms-governance:
    scope_examples:
      - "change-role"
      - "create-meeting"
      - "approve-resolution"
    retention: "24h"

tests:
  - given: "two keys with the same value and same scope"
    expect: "equal — same logical request"
  - given: "two keys with the same value but different scopes"
    expect: "not equal — distinct requests"
  - given: "an empty value"
    expect: "rejected — no default key exists"
  - given: "an empty scope"
    expect: "rejected"
  - given: "a key produced by a binding with normalize: trim"
    expect: "value is trimmed at construction"
